
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080b10">
  <title>Poppy Playtime: Chapter 6 — A Better Place</title>
  <link rel="stylesheet" href="style.css">

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #080b10;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    #game {
      position: fixed;
      inset: 0;
      overflow: hidden;
    }

    #game canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #hud {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }

    #objective {
      position: absolute;
      top: 20px;
      left: 20px;
      max-width: 75%;
      padding: 12px 16px;
      border-left: 3px solid #65d9ff;
      background: #07101bd9;
      font-size: 15px;
    }

    #crosshair {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 8px;
      height: 8px;
      transform: translate(-50%, -50%);
      border: 1px solid #fff;
      border-radius: 50%;
      opacity: .8;
    }

    #hint {
      position: absolute;
      bottom: 17%;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 15px;
      background: #05080ddd;
      border-radius: 6px;
      text-align: center;
      font-size: 14px;
    }

    #help {
      position: absolute;
      bottom: 18px;
      left: 18px;
      padding: 10px 13px;
      color: #d0d8e4;
      background: #07101bd9;
      border-radius: 5px;
      font-size: 12px;
      line-height: 1.7;
    }

    #screen {
      position: fixed;
      inset: 0;
      z-index: 5;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background:
        radial-gradient(ellipse at center, #17202ddd 0%, #05070bf5 75%);
    }

    #panel {
      width: min(460px, 100%);
      padding: 30px;
      border: 1px solid #536272;
      border-radius: 12px;
      background: #0b1019f2;
      box-shadow: 0 0 50px #000a;
      text-align: center;
    }

    #panel h1 {
      margin: 0 0 8px;
      font-size: clamp(25px, 5vw, 39px);
      line-height: 1.1;
      letter-spacing: 1px;
    }

    #panel h2 {
      margin: 0 0 20px;
      color: #6bdcff;
      font-size: 15px;
      font-weight: normal;
      letter-spacing: 3px;
    }

    #panel p {
      color: #c4ccd7;
      line-height: 1.5;
    }

    #panel button {
      display: block;
      width: 100%;
      margin-top: 10px;
      padding: 13px;
      border: 1px solid #50687a;
      border-radius: 5px;
      color: #fff;
      background: #182838;
      font-size: 15px;
      cursor: pointer;
    }

    #panel button:hover {
      background: #24506a;
      border-color: #6bdcff;
    }

    #panel #start {
      color: #071019;
      background: #6bdcff;
      border-color: #6bdcff;
      font-weight: bold;
    }

    #saveStatus {
      min-height: 18px;
      margin-bottom: 0;
      font-size: 12px;
    }

    #toast {
      position: fixed;
      z-index: 8;
      top: 20px;
      right: 20px;
      padding: 12px 16px;
      border: 1px solid #6bdcff;
      border-radius: 5px;
      background: #07101bf2;
      color: #fff;
    }

    #touch {
      display: none;
      position: fixed;
      inset: auto 0 20px;
      z-index: 4;
      justify-content: space-between;
      padding: 0 20px;
      pointer-events: none;
    }

    .pad, .touch-actions {
      display: grid;
      gap: 7px;
      pointer-events: auto;
    }

    .pad {
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(2, 48px);
    }

    .touch-actions {
      align-content: end;
    }

    .touchbutton {
      min-width: 48px;
      min-height: 48px;
      border: 1px solid #b9eaff99;
      border-radius: 10px;
      color: white;
      background: #101e30b8;
      font-size: 17px;
      touch-action: none;
      user-select: none;
    }

    #up { grid-column: 2; }
    #left { grid-column: 1; grid-row: 2; }
    #down { grid-column: 2; grid-row: 2; }
    #right { grid-column: 3; grid-row: 2; }

    @media (pointer: coarse), (max-width: 700px) {
      #touch { display: flex; }
      #help { display: none; }
      #objective { top: 10px; left: 10px; font-size: 12px; }
      #hint { bottom: 155px; width: max-content; max-width: 85%; }
      #panel { padding: 22px; }
    }
  </style>
</head>

<body>
  <div id="game"></div>

  <div id="hud">
    <div id="objective">OBJECTIVE: Explore the laboratory</div>
    <div id="crosshair"></div>
    <div id="hint"></div>
    <div id="help">
      WASD — Move<br>
      Mouse — Look around<br>
      SHIFT — Sprint<br>
      E — Interact<br>
      ESC — Pause
    </div>
  </div>

  <div id="touch">
    <div class="pad">
      <button class="touchbutton" id="up">▲</button>
      <button class="touchbutton" id="left">◀</button>
      <button class="touchbutton" id="down">▼</button>
      <button class="touchbutton" id="right">▶</button>
    </div>
    <div class="touch-actions">
      <button class="touchbutton" id="run">RUN</button>
      <button class="touchbutton" id="use">USE</button>
    </div>
  </div>

  <div id="screen">
    <div id="panel">
      <h1>POPPY PLAYTIME</h1>
      <h2>CHAPTER 6: A BETTER PLACE</h2>
      <p>A quiet laboratory. A missing power supply. Something isn't right.</p>
      <button id="start">NEW GAME</button>
      <button id="continueGame">CONTINUE</button>
      <button id="saveGame">SAVE GAME</button>
      <button id="loadGame">LOAD GAME</button>
      <button id="newGame">RESET SAVE</button>
      <p id="saveStatus">Checking save...</p>
      <p style="font-size:11px">Fan-made prototype. Not an official game.</p>
    </div>
  </div>

  <div id="toast" style="display:none"></div>

  <script type="module">
    import * as THREE from
      "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";

    const SAVE_KEY = "poppyChapter6BetterPlaceSave";

    const game = document.getElementById("game");
    const screen = document.getElementById("screen");
    const objectiveElement = document.getElementById("objective");
    const hint = document.getElementById("hint");
    const toastElement = document.getElementById("toast");
    const saveStatus = document.getElementById("saveStatus");

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x080d15);
    scene.fog = new THREE.Fog(0x080d15, 12, 65);

    const camera = new THREE.PerspectiveCamera(
      75, window.innerWidth / window.innerHeight, 0.1, 100
    );
    camera.rotation.order = "YXZ";
    camera.position.set(0, 1.7, 12);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    game.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0x9bbbdc, 0x17111a, 1.5));

    const mainLight = new THREE.PointLight(0x9bcfff, 45, 50);
    mainLight.position.set(0, 5, 0);
    scene.add(mainLight);

    const materials = {
      floor: new THREE.MeshStandardMaterial({
        color: 0x303945, roughness: 0.85
      }),
      wall: new THREE.MeshStandardMaterial({
        color: 0x65717e, roughness: 0.9
      }),
      dark: new THREE.MeshStandardMaterial({
        color: 0x141c28, roughness: 0.7
      }),
      metal: new THREE.MeshStandardMaterial({
        color: 0x647b8c, metalness: 0.65, roughness: 0.4
      }),
      glass: new THREE.MeshStandardMaterial({
        color: 0x2b7c91, emissive: 0x082735,
        metalness: 0.4, roughness: 0.25
      }),
      yellow: new THREE.MeshStandardMaterial({
        color: 0xe0b53f, emissive: 0x302000
      }),
      red: new THREE.MeshStandardMaterial({
        color: 0xb53a42, emissive: 0x260508
      }),
      green: new THREE.MeshStandardMaterial({
        color: 0x4cd58a, emissive: 0x124528
      })
    };

    const colliders = [];
    const interactables = [];
    const clock = new THREE.Clock();

    const state = {
      running: false,
      objectiveStep: 0,
      terminalUsed: false,
      powerCollected: false,
      x: 0,
      y: 1.7,
      z: 12,
      yaw: 0,
      pitch: 0
    };

    const keys = {};
    let toastTimer;
    let currentTarget = null;
    let touchLookId = null;
    let previousTouchX = 0;
    let previousTouchY = 0;

    function box(name, x, y, z, w, h, d, material, solid = true) {
      const mesh = new THREE.Mesh(
        new THREE.BoxGeometry(w, h, d), material
      );
      mesh.name = name;
      mesh.position.set(x, y, z);
      scene.add(mesh);

      if (solid) {
        colliders.push({
          x, z, hx: w / 2, hz: d / 2,
          bottom: y - h / 2, top: y + h / 2
        });
      }
      return mesh;
    }

    function light(x, y, z, color = 0x7bcfff, intensity = 18) {
      const lamp = new THREE.PointLight(color, intensity, 12);
      lamp.position.set(x, y, z);
      scene.add(lamp);

      const bulb = new THREE.Mesh(
        new THREE.BoxGeometry(1.5, 0.08, 0.22),
        new THREE.MeshBasicMaterial({ color })
      );
      bulb.position.set(x, y + 0.25, z);
      scene.add(bulb);
    }

    function addInteractable(mesh, name, description, action) {
      interactables.push({ mesh, name, description, action });
    }

    function buildWorld() {
      box("Floor", 0, -0.25, -8, 18, 0.5, 66, materials.floor, false);
      box("Ceiling", 0, 5.5, -8, 18, 0.5, 66, materials.dark, false);
      box("Left wall", -9, 2.5, -8, 0.5, 5, 66, materials.wall);
      box("Right wall", 9, 2.5, -8, 0.5, 5, 66, materials.wall);
      box("End wall", 0, 2.5, -40.8, 18, 5, 0.5, materials.wall);

      // Wall supports and overhead pipes.
      for (let z = 19; z >= -35; z -= 7) {
        box("Support", -8.5, 2.5, z, 0.35, 5, 0.35, materials.dark);
        box("Support", 8.5, 2.5, z, 0.35, 5, 0.35, materials.dark);

        box("Ceiling pipe", 0, 4.9, z, 12, 0.16, 0.16, materials.metal, false);
        box("Pipe bracket", -4, 4.7, z, 0.12, 0.4, 0.12, materials.metal, false);
        box("Pipe bracket", 4, 4.7, z, 0.12, 0.4, 0.12, materials.metal, false);

        light(0, 4.7, z, z % 2 === 0 ? 0x80d9ff : 0xffc66d, 14);
      }

      // Observation windows along the corridor.
      for (let z = 12; z >= -30; z -= 8) {
        box("Left observation window", -8.72, 2.5, z, 0.08, 1.6, 3,
          materials.glass, false);
        box("Right observation window", 8.72, 2.5, z, 0.08, 1.6, 3,
          materials.glass, false);
      }

      // Lab workbenches and storage equipment.
      for (const z of [5, -9, -23]) {
        box("Workbench", -5.6, 1, z, 3.4, 1, 1.3, materials.dark);
        box("Workbench top", -5.6, 1.55, z, 3.6, 0.12, 1.5, materials.metal);
        box("Storage crate", -6.1, 0.45, z - 2.4, 1.2, 0.9, 1.1, materials.dark);
        box("Storage crate", 5.9, 0.45, z - 2.4, 1.2, 0.9, 1.1, materials.dark);

        for (let i = 0; i < 3; i++) {
          box("Server rack", 6.5, 1.5 + i * 0.6, z, 1.2, 0.45, 1.2, materials.dark);
          box("Server indicator", 5.88, 1.55 + i * 0.6, z - 0.25,
            0.03, 0.07, 0.1, i === 1 ? materials.red : materials.green, false);
        }
      }

      // Specimen chambers.
      for (const z of [0, -14, -28]) {
        for (const x of [-3.8, 3.8]) {
          box("Chamber base", x, 0.3, z, 2, 0.6, 2, materials.dark);
          box("Chamber glass", x, 1.9, z, 1.5, 2.5, 1.5, materials.glass, false);
          box("Chamber cap", x, 3.25, z, 1.9, 0.2, 1.9, materials.metal, false);

          const tubeLight = new THREE.PointLight(0x36a8d7, 3, 5);
          tubeLight.position.set(x, 2, z);
          scene.add(tubeLight);
        }
      }

      // Terminal the player can use.
      box("Terminal stand", 0, 0.65, -2, 1.8, 1.3, 0.9, materials.dark);
      const terminal = box("Terminal screen", 0, 1.65, -2.25,
        1.4, 0.75, 0.12, materials.glass, false);

      addInteractable(
        terminal,
        "Laboratory terminal",
        "Press E to access the laboratory terminal",
        useTerminal
      );

      // Auxiliary power supply, unlocked by using the terminal.
      box("Power supply stand", 5.4, 0.65, -29, 1.6, 1.3, 1.3, materials.dark);
      const powerUnit = box("Auxiliary power supply", 5.4, 1.55, -29,
        1.1, 1, 0.8, materials.yellow, false);

      addInteractable(
        powerUnit,
        "Auxiliary power supply",
        "Press E to collect the auxiliary power supply",
        collectPower
      );

      // Exit door.
      box("Exit door frame", 0, 2.3, -39.8, 4, 4.6, 0.35, materials.dark, false);
      box("Exit door", 0, 2.1, -39.55, 3.2, 4.1, 0.25, materials.red, false);
      box("Door light", 0, 4.45, -39.3, 0.6, 0.12, 0.08, materials.red, false);

      const sign = new THREE.Mesh(
        new THREE.BoxGeometry(3.4, 0.45, 0.08),
        new THREE.MeshStandardMaterial({
          color: 0x202b38, emissive: 0x08111a
        })
      );
      sign.position.set(0, 4.4, -38.9);
      scene.add(sign);
    }

    function showToast(message) {
      toastElement.textContent = message;
      toastElement.style.display = "block";
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        toastElement.style.display = "none";
      }, 2200);
    }

    function setObjective(message) {
      objectiveElement.textContent = "OBJECTIVE: " + message;
    }

    function useTerminal() {
      if (state.terminalUsed) {
        showToast("The terminal has no other available functions.");
        return;
      }

      state.terminalUsed = true;
      state.objectiveStep = 1;
      setObjective("Find the auxiliary power supply");
      showToast("TERMINAL: Auxiliary power supply location identified.");
      saveGame();
    }

    function collectPower() {
      if (!state.terminalUsed) {
        showToast("The power supply location is not in your records yet.");
        return;
      }

      if (state.powerCollected) {
        showToast("You already collected the power supply.");
        return;
      }

      state.powerCollected = true;
      state.objectiveStep = 2;
      setObjective("Return to the exit door");
      showToast("Auxiliary power supply collected!");
      saveGame();
    }

    function updateTarget() {
      const origin = camera.position.clone();
      const direction = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
      let closest = null;
      let closestDistance = 3.2;

      for (const item of interactables) {
        if (item.name === "Auxiliary power supply" && state.powerCollected) continue;

        const targetPosition = item.mesh.position.clone();
        const distance = origin.distanceTo(targetPosition);
        if (distance > closestDistance) continue;

        const toTarget = targetPosition.sub(origin).normalize();
        if (direction.dot(toTarget) < 0.72) continue;

        closest = item;
        closestDistance = distance;
      }

      currentTarget = closest;
      hint.textContent = closest ? closest.description : "";
    }

    function interact() {
      if (!state.running || !currentTarget) return;
      currentTarget.action();
    }

    function saveGame() {
      try {
        const data = {
          version: 1,
          objectiveStep: state.objectiveStep,
          terminalUsed: state.terminalUsed,
          powerCollected: state.powerCollected,
          player: {
            x: camera.position.x,
            y: camera.position.y,
            z: camera.position.z,
            yaw: camera.rotation.y,
            pitch: camera.rotation.x
          },
          savedAt: new Date().toISOString()
        };

        localStorage.setItem(SAVE_KEY, JSON.stringify(data));
        saveStatus.textContent = "Save stored in this browser.";
        showToast("Game saved!");
        return true;
      } catch (error) {
        saveStatus.textContent = "Saving failed. Browser storage may be blocked.";
        return false;
      }
    }

    function loadGame(showMessage = true) {
      try {
        const raw = localStorage.getItem(SAVE_KEY);
        if (!raw) {
          saveStatus.textContent = "No saved game found.";
          if (showMessage) showToast("No save found.");
          return false;
        }

        const data = JSON.parse(raw);
        const p = data.player;

        if (
          data.version !== 1 ||
          !p ||
          ![p.x, p.y, p.z, p.yaw, p.pitch].every(Number.isFinite)
        ) {
          saveStatus.textContent = "Save file is invalid.";
          return false;
        }

        state.objectiveStep = Number.isInteger(data.objectiveStep)
          ? data.objectiveStep : 0;
        state.terminalUsed = data.terminalUsed === true;
        state.powerCollected = data.powerCollected === true;

        camera.position.set(p.x, p.y, p.z);
        camera.rotation.y = p.yaw;
        camera.rotation.x = p.pitch;

        refreshObjective();
        saveStatus.textContent = "Saved game loaded.";
        if (showMessage) showToast("Game loaded!");
        return true;
      } catch (error) {
        saveStatus.textContent = "Could not read the saved game.";
        return false;
      }
    }

    function refreshObjective() {
      if (state.powerCollected) {
        setObjective("Return to the exit door");
      } else if (state.terminalUsed) {
        setObjective("Find the auxiliary power supply");
      } else {
        setObjective("Explore the laboratory and find the terminal");
      }
    }

    function startGame(loadExisting = false) {
      if (loadExisting && !loadGame(false)) {
        showToast("No saved game found. Starting a new game.");
        resetProgress(false);
      } else if (!loadExisting) {
        resetProgress(false);
      }

      state.running = true;
      screen.style.display = "none";
      clock.getDelta();

      if (matchMedia("(pointer:fine)").matches) {
        renderer.domElement.requestPointerLock?.();
      }
    }

    function resetProgress(eraseSave = true) {
      if (eraseSave) localStorage.removeItem(SAVE_KEY);

      state.objectiveStep = 0;
      state.terminalUsed = false;
      state.powerCollected = false;
      camera.position.set(0, 1.7, 12);
      camera.rotation.set(0, 0, 0);
      refreshObjective();
      saveStatus.textContent = "New game ready.";
    }

    function pauseGame() {
      state.running = false;
      screen.style.display = "flex";
      document.exitPointerLock?.();
      saveStatus.textContent = localStorage.getItem(SAVE_KEY)
        ? "A saved game is available."
        : "No saved game yet.";
    }

    function isBlocked(x, z) {
      const radius = 0.38;
      const playerBottom = camera.position.y - 1.7;
      const playerTop = camera.position.y + 0.1;

      return colliders.some(c => {
        if (playerTop < c.bottom || playerBottom > c.top) return false;

        return (
          x + radius > c.x - c.hx &&
          x - radius < c.x + c.hx &&
          z + radius > c.z - c.hz &&
          z - radius < c.z + c.hz
        );
      });
    }

    function movePlayer(delta) {
      const forward = new THREE.Vector3(
        -Math.sin(camera.rotation.y), 0, -Math.cos(camera.rotation.y)
      );
      const right = new THREE.Vector3(
        Math.cos(camera.rotation.y), 0, -Math.sin(camera.rotation.y)
      );

      const movement = new THREE.Vector3();
      if (keys.KeyW || keys.ArrowUp) movement.add(forward);
      if (keys.KeyS || keys.ArrowDown) movement.sub(forward);
      if (keys.KeyD || keys.ArrowRight) movement.add(right);
      if (keys.KeyA || keys.ArrowLeft) movement.sub(right);

      if (movement.lengthSq() === 0) return;
      movement.normalize();

      const speed = keys.ShiftLeft || keys.ShiftRight ? 7.3 : 4.3;
      const step = movement.multiplyScalar(speed * delta);

      const nextX = camera.position.x + step.x;
      const nextZ = camera.position.z + step.z;

      if (!isBlocked(nextX, camera.position.z)) camera.position.x = nextX;
      if (!isBlocked(camera.position.x, nextZ)) camera.position.z = nextZ;

      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -8.1, 8.1);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -39, 20);
    }

    function bindHoldButton(id, key) {
      const button = document.getElementById(id);
      if (!button) return;

      button.addEventListener("pointerdown", event => {
        event.preventDefault();
        keys[key] = true;
        button.setPointerCapture?.(event.pointerId);
      });

      const release = event => {
        event.preventDefault();
        keys[key] = false;
      };

      button.addEventListener("pointerup", release);
      button.addEventListener("pointercancel", release);
      button.addEventListener("lostpointercapture", () => {
        keys[key] = false;
      });
    }

    bindHoldButton("up", "KeyW");
    bindHoldButton("down", "KeyS");
    bindHoldButton("left", "KeyA");
    bindHoldButton("right", "KeyD");
    bindHoldButton("run", "ShiftLeft");

    document.getElementById("use").addEventListener("pointerdown", event => {
      event.preventDefault();
      interact();
    });

    renderer.domElement.addEventListener("pointerdown", event => {
      if (event.pointerType === "touch") {
        touchLookId = event.pointerId;
        previousTouchX = event.clientX;
        previousTouchY = event.clientY;
      }
    });

    renderer.domElement.addEventListener("pointermove", event => {
      if (event.pointerType === "touch" && event.pointerId === touchLookId && state.running) {
        const dx = event.clientX - previousTouchX;
        const dy = event.clientY - previousTouchY;
        previousTouchX = event.clientX;
        previousTouchY = event.clientY;

        camera.rotation.y -= dx * 0.004;
        camera.rotation.x -= dy * 0.004;
        camera.rotation.x = THREE.MathUtils.clamp(camera.rotation.x, -1.4, 1.4);
      }
    });

    renderer.domElement.addEventListener("pointerup", event => {
      if (event.pointerId === touchLookId) touchLookId = null;
    });

    document.addEventListener("mousemove", event => {
      if (!state.running || document.pointerLockElement !== renderer.domElement) return;

      camera.rotation.y -= event.movementX * 0.002;
      camera.rotation.x -= event.movementY * 0.002;
      camera.rotation.x = THREE.MathUtils.clamp(camera.rotation.x, -1.4, 1.4);
    });

    document.addEventListener("keydown", event => {
      keys[event.code] = true;

      if (event.code === "KeyE" && !event.repeat) interact();

      if (event.code === "Escape" && state.running) {
        pauseGame();
      }
    });

    document.addEventListener("keyup", event => {
      keys[event.code] = false;
    });

    document.getElementById("start").addEventListener("click", () => {
      startGame(false);
    });

    document.getElementById("continueGame").addEventListener("click", () => {
      if (localStorage.getItem(SAVE_KEY)) {
        startGame(true);
      } else {
        saveStatus.textContent = "No saved game found. Choose New Game.";
        showToast("No save found.");
      }
    });

    document.getElementById("saveGame").addEventListener("click", () => {
      saveGame();
    });

    document.getElementById("loadGame").addEventListener("click", () => {
      if (loadGame()) {
        startGame(true);
      }
    });

    document.getElementById("newGame").addEventListener("click", () => {
      resetProgress(true);
      saveStatus.textContent = "Save reset. Choose New Game to begin.";
      showToast("Save reset.");
    });

    document.addEventListener("pointerlockchange", () => {
      if (!document.pointerLockElement && state.running &&
          matchMedia("(pointer:fine)").matches) {
        pauseGame();
      }
    });

    window.addEventListener("beforeunload", () => {
      if (state.running) {
        try {
          localStorage.setItem(SAVE_KEY, JSON.stringify({
            version: 1,
            objectiveStep: state.objectiveStep,
            terminalUsed: state.terminalUsed,
            powerCollected: state.powerCollected,
            player: {
              x: camera.position.x,
              y: camera.position.y,
              z: camera.position.z,
              yaw: camera.rotation.y,
              pitch: camera.rotation.x
            },
            savedAt: new Date().toISOString()
          }));
        } catch (error) {
          // Browser storage might be disabled.
        }
      }
    });

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    });

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);

      if (state.running) {
        movePlayer(delta);
        updateTarget();
      }

      renderer.render(scene, camera);
    }

    buildWorld();
    refreshObjective();

    if (localStorage.getItem(SAVE_KEY)) {
      saveStatus.textContent = "A saved game was found in this browser.";
    } else {
      saveStatus.textContent = "No save found yet.";
    }

    animate();
  </script>
</body>
</html>
